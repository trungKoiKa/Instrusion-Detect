#Cấu hình broker SafeCam, chép vào /etc/mosquitto/conf.d/
#Persistence true đã có trong /etc/mosquitto/mosquitto.conf mặc định

#nghe cổng 1883 trên mọi card mạng để ESP32, laptop kết nối được 
listener 1883 0.0.0.0

#Cấm vào khi không đăng nhập
allow_anonymous false

#File chứa tài khoản, tạo bằng mosquitto_passwd ở bước 1c
password_file /etc/mosquitto/passwd

# Mỗi tài khoản chỉ được đọc/ghi topic của mình
acl_file /etc/mosquitto/safecam.acl